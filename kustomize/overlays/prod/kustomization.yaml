apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: starrocks-prod

# 환경별 커스터마이제이션만 관리
# Application 및 Namespace는 argocd/applications.yaml에서 관리

# 공통 레이블 추가
commonLabels:
  app: starrocks
  environment: prod

# ConfigMap으로 환경별 설정 정보 제공
configMapGenerator:
  - name: starrocks-prod-config
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=warn
      - REPLICA_COUNT=3
